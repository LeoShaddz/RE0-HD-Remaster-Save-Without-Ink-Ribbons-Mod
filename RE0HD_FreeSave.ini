[Main]
Enable=1
; 1 = creates the RE0HD_FreeSave.log file (diagnostics). 0 = no log and no file is created. (default: 0)
Log=0
; 1 = allows saving at the typewriter without an ink ribbon. 0 = original behavior. (default: 1)
FreeSave=1
; 1 = if you HAVE an ink ribbon, it is still consumed when saving (as in the original game).
; 0 = ink ribbons are never consumed (saving is always free). (default: 1)
ConsumeRibbon=1
; 1 = when you PICK UP an ink ribbon in the environment, a green herb is added to your inventory instead (the model in the environment
; remains that of an ink ribbon). The picked-up quantity is preserved. (default: 1)
RibbonToHerb=0
; Item IDs (found in your log): ink ribbon = 55, green herb = 43. To replace it with a different item, change HerbItemId.
RibbonItemId=55
HerbItemId=43
; 1 = logs inventory calls to RE0HD_FreeSave.log (for investigation). Keep at 0 during normal use. (default: 0)
LogItems=0